spring.application.name=beta_1_Bizti

# Base de datos H2 en ARCHIVO: los datos se conservan al apagar el backend.
# Se guarda en la carpeta personal del usuario (ej. C:\Users\Usuario\bizti-data\).
# Para empezar de cero, borrar esa carpeta bizti-data.
# Las credenciales salen de variables de entorno; los valores despues de ":" son solo para desarrollo local.
spring.datasource.url=${BIZTI_DB_URL:jdbc:h2:file:${user.home}/bizti-data/bizti}
spring.datasource.username=${BIZTI_DB_USUARIO:sa}
spring.datasource.password=${BIZTI_DB_CLAVE:}

# JPA crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
# Las entidades se convierten a DTO dentro del servicio: no hace falta abrir la sesion en la vista
spring.jpa.open-in-view=false

# Consola web de H2: http://localhost:8080/h2-console (solo desarrollo)
spring.h2.console.enabled=${BIZTI_H2_CONSOLA:true}

# Paginacion: JSON estable { content: [...], page: { size, number, totalElements, totalPages } }
spring.data.web.pageable.serialization-mode=via-dto
spring.data.web.pageable.max-page-size=1000

# Documentacion: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Origenes permitidos por CORS (separados por coma)
bizti.cors.origenes=${BIZTI_CORS_ORIGENES:http://localhost:*,http://127.0.0.1:*}
