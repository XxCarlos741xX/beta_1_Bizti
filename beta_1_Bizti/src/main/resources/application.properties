spring.application.name=beta_1_Bizti

# Base de datos H2 en ARCHIVO: los datos se conservan al apagar el backend.
# Se guarda en la carpeta personal del usuario (ej. C:\Users\Usuario\bizti-data\), sin importar desde donde se ejecute.
# Para empezar de cero, borrar esa carpeta bizti-data.
spring.datasource.url=jdbc:h2:file:${user.home}/bizti-data/bizti
spring.datasource.username=sa
spring.datasource.password=

# JPA crea/actualiza las tablas a partir de los modelos
spring.jpa.hibernate.ddl-auto=update

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Incluir el mensaje de los errores en la respuesta JSON (ej. "Correo o contrasena incorrectos")
server.error.include-message=always
